name: CodeEdit
options:
  bundleIdPrefix: one.lxc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

configs:
  Debug: debug
  Release: release

packages:
  Runestone:
    url: https://github.com/simonbs/Runestone
    version: 0.5.2
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    version: 0.1.10
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  NIOSSH:
    # 本地 vendoring（含 RSA-SHA2 补丁，复用 openCoder），见 Vendor/swift-nio-ssh/PATCHES.md
    path: Vendor/swift-nio-ssh
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0

targets:
  CodeEdit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CodeEdit
        excludes:
          - Info.plist
      - path: Themes
    info:
      path: CodeEdit/Info.plist
      properties:
        CFBundleDisplayName: CodeEdit for iOS
        CFBundleName: CodeEdit
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: one.lxc.codeedit
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CodeEdit/Info.plist
    dependencies:
      - package: Runestone
        product: Runestone
      - package: TreeSitterLanguages
        products:
          - TreeSitterSwiftRunestone
          - TreeSitterPythonRunestone
          - TreeSitterJavaScriptRunestone
          - TreeSitterTypeScriptRunestone
          - TreeSitterTSXRunestone
          - TreeSitterJSONRunestone
          - TreeSitterHTMLRunestone
          - TreeSitterCSSRunestone
          - TreeSitterSCSSRunestone
          - TreeSitterCRunestone
          - TreeSitterCPPRunestone
          - TreeSitterCSharpRunestone
          - TreeSitterJavaRunestone
          - TreeSitterGoRunestone
          - TreeSitterRustRunestone
          - TreeSitterRubyRunestone
          - TreeSitterPHPRunestone
          - TreeSitterBashRunestone
          - TreeSitterYAMLRunestone
          - TreeSitterTOMLRunestone
          - TreeSitterMarkdownRunestone
          - TreeSitterSQLRunestone
          - TreeSitterLuaRunestone
      - package: Citadel
        product: Citadel
      - package: SwiftTerm
        product: SwiftTerm
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIO

schemes:
  CodeEdit:
    build:
      targets:
        CodeEdit: all
    run:
      config: Debug
    archive:
      config: Release
